name: Clarify parked delivery resolution

on:
  push:
    branches: [arch/sync-sad-005-v2.2]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/sync-sad-005-v2.2
      - shell: python
        run: |
          from pathlib import Path
          p = Path('docs/designs/TDD-notif-runtime-001-notification-lifecycle-snapshot.md')
          s = p.read_text()
          old = 'Terminal Delivery states are `DELIVERED`, `FAILED_PERMANENT`, `PARKED`, `SUPPRESSED`, and `CANCELLED`. `UNKNOWN` is non-terminal but blocks blind retry/failover until reconciliation proves a safe transition.'
          new = 'Semantic terminal Delivery states are `DELIVERED`, `FAILED_PERMANENT`, `SUPPRESSED`, and `CANCELLED`. `PARKED` is terminal for automatic processing only: no worker may retry or fail over it, but a governed evidence-based operator/policy resolution may move it to a proven state or reopen it for a safe retry. `UNKNOWN` blocks blind retry/failover until reconciliation proves a safe transition.'
          assert old in s
          s = s.replace(old, new, 1)
          old2 = '    UNKNOWN --> PARKED: cannot safely resolve automatically\n```'
          new2 = '    UNKNOWN --> PARKED: cannot safely resolve automatically\n    PARKED --> READY: governed resolution proves effect absent and retry safe\n    PARKED --> PROVIDER_ACCEPTED: governed evidence proves acceptance\n    PARKED --> DELIVERED: governed evidence proves delivery\n    PARKED --> FAILED_PERMANENT: governed evidence proves terminal no-delivery\n```'
          assert old2 in s
          s = s.replace(old2, new2, 1)
          old3 = '| `UNKNOWN` | no safe automatic resolution | `PARKED` | evidence retained; operator/policy resolution required |'
          new3 = old3 + '\n| `PARKED` | governed effect-absence proof | `READY` | explicit resolution evidence; retry budget permits |\n| `PARKED` | governed provider evidence | proven normalized state | only evidence-supported `PROVIDER_ACCEPTED`, `DELIVERED`, or `FAILED_PERMANENT` |'
          assert old3 in s
          s = s.replace(old3, new3, 1)
          old4 = 'Operators can distinguish accepted, scheduled, active, provider-accepted, delivered, failed, unknown, parked, suppressed, and cancelled states.'
          new4 = old4 + ' Parked resolution is privileged/evidenced and never equivalent to manually fabricating delivery success.'
          assert old4 in s
          p.write_text(s.replace(old4, new4, 1))
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/designs/TDD-notif-runtime-001-notification-lifecycle-snapshot.md
          git commit -m 'docs(runtime): clarify governed parked delivery resolution'
          git push origin HEAD:arch/sync-sad-005-v2.2
