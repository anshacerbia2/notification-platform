name: Sync SAD-005 v2.2 TDDs

on:
  push:
    branches:
      - arch/sync-sad-005-v2.2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/sync-sad-005-v2.2
      - name: Apply downstream TDD alignment
        shell: python
        run: |
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text)

          common = [
              ('version: 1.1.0', 'version: 1.2.0'),
              ('last_reviewed: 2026-08-28', 'last_reviewed: 2026-09-09'),
          ]

          edit('docs/designs/TDD-notif-runtime-001-notification-lifecycle-snapshot.md', common + [
              ('Delivery states: `PLANNED`, `READY`, `ATTEMPTING`, `PROVIDER_ACCEPTED`, `DELIVERED`, `FAILED_PERMANENT`, `UNKNOWN`, `SUPPRESSED`, `CANCELLED`.',
               'Delivery states: `PLANNED`, `READY`, `ATTEMPTING`, `PROVIDER_ACCEPTED`, `DELIVERED`, `FAILED_PERMANENT`, `UNKNOWN`, `PARKED`, `SUPPRESSED`, `CANCELLED`.'),
              ('Terminal Delivery states are `DELIVERED`, `FAILED_PERMANENT`, `SUPPRESSED`, and `CANCELLED`. `UNKNOWN` is non-terminal but blocks blind retry/failover.',
               'Terminal Delivery states are `DELIVERED`, `FAILED_PERMANENT`, `PARKED`, `SUPPRESSED`, and `CANCELLED`. `UNKNOWN` is non-terminal but blocks blind retry/failover until reconciliation proves a safe transition.'),
              ('| `UNKNOWN` | effect absent proven | `READY` | retry policy permits |\n| any started state | Notification cancelled | unchanged | blocks future attempts only |',
               '| `UNKNOWN` | effect absent proven | `READY` | retry policy permits |\n| `UNKNOWN` | no safe automatic resolution | `PARKED` | evidence retained; operator/policy resolution required |\n| any started state | Notification cancelled | unchanged | blocks future attempts only |'),
              ('No adapter, API, or UI owns a competing state machine.\n',
               'No adapter, API, or UI owns a competing state machine.\n\n```mermaid\nstateDiagram-v2\n    [*] --> PLANNED\n    PLANNED --> READY: activation\n    READY --> SUPPRESSED: suppression denies\n    READY --> CANCELLED: cancellation wins before start\n    READY --> ATTEMPTING: attempt-start commit\n    ATTEMPTING --> PROVIDER_ACCEPTED: acceptance proven\n    ATTEMPTING --> FAILED_PERMANENT: no-delivery proven\n    ATTEMPTING --> UNKNOWN: external effect ambiguous\n    PROVIDER_ACCEPTED --> DELIVERED: final receipt\n    PROVIDER_ACCEPTED --> FAILED_PERMANENT: authoritative negative receipt\n    PROVIDER_ACCEPTED --> UNKNOWN: status becomes ambiguous\n    UNKNOWN --> READY: effect absence proven and retry permitted\n    UNKNOWN --> PROVIDER_ACCEPTED: reconciliation proves acceptance\n    UNKNOWN --> DELIVERED: reconciliation proves delivery\n    UNKNOWN --> FAILED_PERMANENT: reconciliation proves terminal no-delivery\n    UNKNOWN --> PARKED: cannot safely resolve automatically\n```\n'),
              ('Operators can distinguish accepted, scheduled, active, provider-accepted, delivered, failed, unknown, suppressed, and cancelled states.',
               'Operators can distinguish accepted, scheduled, active, provider-accepted, delivered, failed, unknown, parked, suppressed, and cancelled states.'),
              ('Implements SAD-005 Notification Aggregate, Recipient Snapshot, Delivery Planning, suppression, and cancellation semantics;',
               'Implements SAD-005 v2.2 Notification Aggregate, Recipient Snapshot, Delivery Planning, suppression, cancellation, and parked-ambiguity semantics;'),
          ])

          edit('docs/designs/TDD-notif-runtime-002-runtime-persistence-concurrency.md', common + [
              ('- `provider_callback_inbox(provider_binding_id, provider_event_key, payload_hash, received_at, applied_at)`',
               '- `provider_callback_inbox(provider_binding_id, provider_event_key, payload_hash, provider_event_at, provider_sequence, provider_version, received_at, applied_at, apply_outcome, reconciliation_required)`'),
              ('Recipient endpoint protection uses versioned authenticated encryption through the governed enterprise key-management boundary.',
               'Delivery state includes `PARKED` for ambiguity that cannot be safely resolved automatically. Provider callback ordering evidence is stored independently from local receipt time so callback arrival order cannot become state authority.\n\nRecipient endpoint protection uses versioned authenticated encryption through the governed enterprise key-management boundary.'),
              ('Indexes cover `(state, ready_at)` for ready Deliveries and outbox `(state, available_at)`.',
               'Indexes cover `(state, ready_at)` for ready Deliveries, outbox `(state, available_at)`, callback deduplication by provider event identity, and provider message/order lookup needed for reconciliation.'),
              ('Callback application locks callback-inbox identity then the matching Delivery.',
               'Callback application locks callback-inbox identity then the matching Delivery. It persists provider event time plus provider sequence/version when available before deciding whether the normalized transition is current, stale, duplicate, or contradictory.'),
              ('unique callback/idempotency constraints, outbox atomicity, provider-outage backlog, and 10x forecast acceptance/worker load.',
               'unique callback/idempotency constraints, out-of-order and contradictory callback evidence, parked ambiguity, outbox atomicity, provider-outage backlog, and 10x forecast acceptance/worker load.'),
              ('Implements SAD-005 State & Data Architecture and Channel Dispatch Worker concurrency.',
               'Implements SAD-005 v2.2 State & Data Architecture and Channel Dispatch Worker concurrency.'),
          ])

          edit('docs/designs/TDD-notif-runtime-004-delivery-attempt-provider-policy.md', common + [
              ('| retraction | `NONE`, `SUPPORTED` |\n| retry_after | boolean |',
               '| retraction | `NONE`, `SUPPORTED` |\n| ordering | `NONE`, `EVENT_TIME`, `SEQUENCE`, `VERSION` |\n| failover_safety | `ABSENCE_REQUIRED`, `DUPLICATE_SAFE_EQUIVALENT` |\n| retry_after | boolean |'),
              ('Provider Safety Classification\n\nUnknown provider capabilities default conservatively to no idempotency, no reconciliation, no retraction, and no final-receipt claim.',
               'Provider Safety Classification\n\nUnknown provider capabilities default conservatively to no idempotency, no reconciliation, no retraction, no ordering guarantee, `ABSENCE_REQUIRED` failover, and no final-receipt claim.'),
              ('Failover is allowed only after the prior provider effect is proven absent.',
               'Failover is allowed only after the prior provider effect is proven absent unless the provider/channel contract explicitly proves semantically equivalent cross-provider duplicate safety. `DUPLICATE_SAFE_EQUIVALENT` is exceptional and requires contract tests; it is never inferred from two providers accepting idempotency keys.'),
              ('Outcome normalization:\n- known accepted -> `PROVIDER_ACCEPTED`',
               'Outcome normalization:\n- provider ordering/version metadata is preserved as evidence and consumed by callback/reconciliation policy; arrival order never becomes authority\n- known accepted -> `PROVIDER_ACCEPTED`'),
              ('- capability flags validated against adapter declaration',
               '- capability flags validated against adapter declaration\n- callback ordering/version capability\n- failover-safety class and its evidence/contract-test requirement'),
              ('Provider contract tests cover stable idempotency, timeout before/after provider acceptance, non-idempotent ambiguous send, unknown parking, reconciliation proving present/absent, callback resolution, safe failover, Retry-After, circuit breaker, secret rotation before next attempt, and immutable attempt evidence.',
               'Provider contract tests cover stable idempotency, timeout before/after provider acceptance, non-idempotent ambiguous send, unknown parking, reconciliation proving present/absent, callback ordering/version semantics, contradictory callback resolution, safe failover classification, Retry-After, circuit breaker, secret rotation before next attempt, and immutable attempt evidence.'),
              ('Implements SAD-005 Provider Adapters, Provider Capability/Suppression/Unknown-Outcome Policy, Retry & Reconciliation, and §4.10.',
               'Implements SAD-005 v2.2 Provider Adapters, Provider Capability/Suppression/Unknown-Outcome Policy, Retry & Reconciliation, and Delivery Attempt lifecycle.'),
          ])

          edit('docs/designs/TDD-notif-runtime-005-scheduling-composition.md', common + [
              ('- `schedule_version` nullable until bound/recovered\n- `last_attempt_at`',
               '- `schedule_version` nullable until bound/recovered\n- `target_contract_id` and immutable `target_contract_version` used for registration\n- `last_attempt_at`'),
              ('Frozen registration sends a one-time Schedule request containing:\n- target registered Notification wake-up contract',
               'Frozen registration sends a one-time Schedule request containing:\n- registered `target_contract_id` and explicit `target_contract_version` for the Notification wake-up contract'),
              ('Trigger acceptance consumes `com.scnehaux.scheduling.occurrence.due.v1`.',
               'Trigger acceptance consumes `com.scnehaux.scheduling.occurrence.due.v1` and verifies that the immutable target contract/version on the Occurrence matches the locally bound registration generation before Delivery activation.'),
              ('Deferred Notification Command target uses a separately registered contract and bounded immutable input sufficient for Notification creation.',
               'Deferred Notification Command target uses a separately registered versioned Target Contract and bounded immutable input sufficient for Notification creation.'),
              ('3. success persists `schedule_id`, returned `schedule_version`, and `BOUND`',
               '3. success persists `schedule_id`, returned `schedule_version`, the resolved target contract/version, and `BOUND`'),
              ('Fault-injection tests kill processes between every registration step, verify same Schedule ID on retry, test conflicting generation protection, duplicate occurrence, cancelled late trigger, Scheduler outage, binding reconciliation, direct/RabbitMQ/Kafka trigger profiles, and deferred-command size/secret rejection.',
               'Fault-injection tests kill processes between every registration step, verify same Schedule ID on retry, test conflicting generation protection, target-contract version mismatch, target deprecation/rebind compatibility, duplicate occurrence, cancelled late trigger, Scheduler outage, binding reconciliation, direct/RabbitMQ/Kafka trigger profiles, and deferred-command size/secret rejection.'),
              ('Implements SAD-005 Scheduling Registration/Binding/Reconciliation and Trigger Acceptance modules.',
               'Implements SAD-005 v2.2 Scheduling Registration/Binding/Reconciliation and Trigger Acceptance modules, including versioned Scheduling Target Contract binding.'),
          ])

          edit('docs/designs/TDD-notif-runtime-007-provider-callback-receipts.md', [
              ('version: 1.0.0', 'version: 1.1.0'),
              ('last_reviewed: 2026-08-27', 'last_reviewed: 2026-09-09'),
              ('Persist safe evidence:\n- provider event ID/fingerprint\n- provider message ID\n- received timestamp',
               'Persist safe evidence:\n- provider event ID/fingerprint\n- provider message ID\n- provider event timestamp when supplied\n- provider sequence/version when supplied\n- local received timestamp'),
              ('- apply outcome\n- correlation to Attempt/Delivery',
               '- apply outcome (`APPLIED`, `DUPLICATE`, `STALE`, `CONTRADICTORY`, `UNMATCHED`)\n- reconciliation-required flag/reason when evidence conflicts\n- correlation to Attempt/Delivery'),
              ('6. normalize provider status\n7. apply monotonic transition policy\n8. write lifecycle outbox',
               '6. normalize provider status plus provider event-time/sequence/version metadata\n7. compare provider ordering/version metadata where available\n8. apply only a legal monotonic normalized transition; duplicate/stale evidence is retained without regression\n9. mark contradictory/ambiguous evidence for reconciliation rather than last-write-wins\n10. write lifecycle outbox'),
              ('9. commit\n10. acknowledge provider', '11. commit\n12. acknowledge provider'),
              ('- duplicate callback is idempotent',
               '- duplicate callback is idempotent\n- conflicting callbacks do not use last-write-wins; they preserve both evidence records and enter provider-specific reconciliation\n- event arrival time alone never authorizes a backwards normalized transition'),
              ('- `notification_callback_state_advances_total{from,to}`',
               '- `notification_callback_state_advances_total{from,to}`\n- `notification_callback_stale_total{provider}`\n- `notification_callback_contradictory_total{provider}`\n- `notification_callback_reconciliation_required_total{provider}`'),
              ('Provider contract tests cover valid/invalid signature, key rotation, replay, duplicate callback, out-of-order receipts, unknown correlation, `UNKNOWN` resolution, final-state non-regression, DB failure before ack, payload limits, and telemetry redaction.',
               'Provider contract tests cover valid/invalid signature, key rotation, replay, duplicate callback, provider sequence/version ordering, out-of-order receipts, contradictory receipts, unknown correlation, `UNKNOWN` resolution, final-state non-regression, DB failure before ack, payload limits, and telemetry redaction.'),
              ('Implements SAD-005 Callback/Receipt Normalization and Provider Callback flow.',
               'Implements SAD-005 v2.2 Callback/Receipt Normalization and provider ordering/contradiction reconciliation flow.'),
          ])
      - name: Commit synchronized TDDs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/designs/TDD-notif-runtime-001-notification-lifecycle-snapshot.md \
                  docs/designs/TDD-notif-runtime-002-runtime-persistence-concurrency.md \
                  docs/designs/TDD-notif-runtime-004-delivery-attempt-provider-policy.md \
                  docs/designs/TDD-notif-runtime-005-scheduling-composition.md \
                  docs/designs/TDD-notif-runtime-007-provider-callback-receipts.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(runtime): align notification TDDs with SAD-005 v2.2'
          git push origin HEAD:arch/sync-sad-005-v2.2
